name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    type: [opened, synchronize]
  workflow_dispatch:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint
